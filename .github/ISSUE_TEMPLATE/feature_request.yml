name: Feature request
description: Suggest an improvement, new capability, or new session source
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow or pain point does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, keybinding, or UX you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you considered?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or session storage details (if proposing a new source).
